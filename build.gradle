plugins {
	// fabric-loom handles the unobfuscated 26.x versions; fabric-loom-remap is
	// its variant for obfuscated/intermediary versions up to 1.21.11.
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'maven-publish'
}

// Each Stonecutter node builds this script with its own versions/*/gradle.properties
def legacyMinecraft = project.minecraft_version.startsWith("1.")
apply plugin: legacyMinecraft ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

version = "${project.mod_version}+${stonecutter.current.version}"
group = project.maven_group

def javaVersion = Integer.parseInt(project.java_version)

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"private-chests" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		gametest {
			server()
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/junit-gametest.xml"
			runDir "build/gametest"
		}
	}
}

dependencies {
	// To change the versions see the versions/*/gradle.properties files
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	if (legacyMinecraft) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	}

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "failed", "skipped"
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_range", project.minecraft_range
	inputs.property "java_version", project.java_version
	inputs.property "mixin_java_level", project.mixin_java_level

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version,
			"minecraft_range": inputs.properties.minecraft_range,
			"java_version": inputs.properties.java_version
	}

	filesMatching("private-chests.mixins.json") {
		expand "mixin_java_level": inputs.properties.mixin_java_level
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
